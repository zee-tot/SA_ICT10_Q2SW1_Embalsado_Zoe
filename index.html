<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #fff0f5; color: #5a2a3c; }
        h3 { font-family: 'Pacifico', cursive; font-weight: 400; }
        form { background-color: white; border: 2px solid #f4a6c0; }
        .btn { background-color: #f4a6c0; border-color: #f4a6c0; color: #5a2a3c; }
        #output { background-color: #ffd6e5; font-size: 20px; }
        #output:empty { display: none; }
    </style>
    <title>2nd Quarter | Seatwork 1</title>
</head>
<body>
    <div class="container mt-5">
        <h3 class="mb-4">Add new Glee club member ꨄ︎:</h3>
        <form class="mb-4 p-3 rounded">
            <div class="mb-3">
                <input type="text" id="first_name" class="form-control" placeholder="Enter the first name">
            </div>
            <div class="mb-3">
                <input type="text" id="last_name" class="form-control" placeholder="Enter the last name">
            </div>
            <input type="button" value="Submit" py-click="result_checker" class="btn" style="background-color: #f4a6c0; border-color: #f4a6c0; color: #5a2a3c;">
        </form>
            <div id="output" class="p-3 rounded" style="background-color: #ffd6e5; color: #5a2a3c; font-size: 20px;"></div>
    </div>

    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
